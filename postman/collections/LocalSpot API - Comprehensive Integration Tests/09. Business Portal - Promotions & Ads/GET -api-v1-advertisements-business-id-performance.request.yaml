$kind: http-request
name: GET /api/v1/advertisements/business/:id/performance
url: "{{baseUrl}}/api/v1/advertisements/business/:id/performance"
method: GET
headers:
  ngrok-skip-browser-warning: "true"
pathVariables:
  id: "1"
auth:
  type: bearer
  credentials:
    token: "{{businessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Response status is valid (2xx or expected 4xx)', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 204, 400, 401, 403, 404, 409, 422]);
      });
      pm.test('Response time is acceptable', function () {
          pm.expect(pm.response.responseTime).to.be.below(1500);
      });
    language: text/javascript
order: 16000
